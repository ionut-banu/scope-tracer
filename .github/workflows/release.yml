name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true
      check_only:
        description: 'Run only the pre-publish checks; publish nothing'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Everything that can stop a release before it reaches Maven Central. `publish` needs this
  # job, so nothing is published when a check fails. Run it alone with `check_only`.
  check:
    runs-on: ubuntu-latest

    steps:
      # The dispatched ref supplies the check script, so a dry run from main can check an old
      # tag. On a tag push the dispatched ref is the tag, so both checkouts are the same tree.
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: tagged

      - name: Verify tag matches pom version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ -n "${{ inputs.tag }}" ]; then TAG="${{ inputs.tag }}"; TAG="${TAG#v}"; fi
          POM_VERSION=$(mvn -f tagged/pom.xml help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [ "$TAG" != "$POM_VERSION" ]; then
            echo "::error::Tag '$TAG' does not match pom version '$POM_VERSION'"
            exit 1
          fi
          echo "Releasing version $POM_VERSION"

      - name: Check the docs name this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -n "${{ inputs.tag }}" ]; then VERSION="${{ inputs.tag }}"; VERSION="${VERSION#v}"; fi
          bash .github/scripts/check-release-docs.sh "$VERSION" tagged

      # The central-publishing extension builds and uploads in one `deploy`, so the bundle cannot
      # be checked in `publish` before the upload. Build it here with -DskipUpload=true: no
      # credentials and no signing key are needed. The checkout of the dispatched ref supplies the
      # script; the tag's tree supplies the bundle.
      - name: Set up JDK 27
        uses: actions/setup-java@v5
        with:
          java-version: '27'
          distribution: 'temurin'
          cache: maven

      - name: Build the Central bundle without uploading it
        working-directory: tagged
        run: mvn -B -P release deploy -DskipTests -DskipITs -Dgpg.skip=true -DskipUpload=true -Dmaven.javadoc.skip=true

      - name: Check the bundle holds only the published artifacts
        run: bash .github/scripts/check-release-bundle.sh tagged/target/central-publishing/central-bundle.zip

  publish:
    needs: check
    if: ${{ !inputs.check_only }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up JDK 27
        uses: actions/setup-java@v5
        with:
          java-version: '27'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Build, test, sign, and publish to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -P release deploy

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -n "${{ inputs.tag }}" ]; then VERSION="${{ inputs.tag }}"; VERSION="${VERSION#v}"; fi
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if ($0 ~ "\\[" v "\\]") { found=1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release $VERSION" > release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: |
            scope-tracer-core/target/scope-tracer-core-*.jar
            scope-tracer-analyzer/target/scope-tracer-analyzer-*.jar
            scope-tracer-agent/target/scope-tracer-agent-*.jar
          fail_on_unmatched_files: false
