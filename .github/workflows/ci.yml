name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 27
        uses: actions/setup-java@v5
        with:
          java-version: '27'
          distribution: 'temurin'
          cache: maven

      - name: Self-test the release docs check
        run: |
          bash .github/scripts/check-release-docs-test.sh
          bash .github/scripts/readme-image-test.sh

      - name: Build, test, and style check
        run: mvn -q verify

      # The gallery under docs/ is generated. This fails the pull request when the renderer or a
      # scenario changed and the reports were not regenerated (run GalleryMain without --check
      # and commit; then run .github/scripts/readme-image.sh). Not part of `mvn verify`: it records real scopes, and a timing flake must
      # not fail the build the way it would in a unit test.
      - name: Check the gallery and the README image are up to date
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          mvn -pl scope-tracer-demos -am -q -DskipTests package dependency:build-classpath -Dmdep.outputFile=/tmp/scope-tracer-cp.txt
          JARS="scope-tracer-core/target/scope-tracer-core-${VERSION}.jar:scope-tracer-analyzer/target/scope-tracer-analyzer-${VERSION}.jar:scope-tracer-demos/target/scope-tracer-demos-${VERSION}.jar:$(cat /tmp/scope-tracer-cp.txt)"
          java --enable-preview -cp "$JARS" com.ionutbanu.scopetracer.demos.GalleryMain --check
          .github/scripts/readme-image.sh --check

      - name: Upload Jacoco coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage
          path: |
            scope-tracer-*/target/site/jacoco/
          if-no-files-found: ignore

  plugin:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The analyzer and agent jars are built by Maven on JDK 27; the plugin is a separate Gradle
      # build on JDK 21 (the IDE's JVM). Install both; the later one becomes JAVA_HOME.
      - name: Set up JDK 21 and 27
        uses: actions/setup-java@v5
        with:
          java-version: |
            21
            27
          distribution: 'temurin'
          cache: maven

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the analyzer and agent jars the plugin bundles
        run: mvn -q -DskipTests package

      - name: Build the plugin and run its :model tests
        working-directory: scope-tracer-plugin
        run: JAVA_HOME="$JAVA_HOME_21_X64" ./gradlew build
