name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      - name: Build, test, and style check
        run: mvn -q verify

      - name: Upload Jacoco coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage
          path: |
            scope-tracer-*/target/site/jacoco/
          if-no-files-found: ignore

  plugin:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The analyzer and agent jars are built by Maven on JDK 26; the plugin is a separate Gradle
      # build on JDK 21 (the IDE's JVM). Install both; the later one becomes JAVA_HOME.
      - name: Set up JDK 21 and 26
        uses: actions/setup-java@v5
        with:
          java-version: |
            21
            26
          distribution: 'temurin'
          cache: maven

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the analyzer and agent jars the plugin bundles
        run: mvn -q -DskipTests package

      - name: Build the plugin and run its :model tests
        working-directory: scope-tracer-plugin
        run: JAVA_HOME="$JAVA_HOME_21_X64" ./gradlew build
