name: Plugin Verifier

# Runs the IntelliJ Plugin Verifier (verifyPlugin) on pull requests that touch the plugin, so a
# broken IDE range or a removed platform API shows up on the pull request and not on release day
# (release.yml still runs it too: the release is the gate that cannot be skipped, this is the
# early warning). It is not a required check. The IDEs are the ones pluginVerification in
# scope-tracer-plugin/build.gradle.kts names, the newest 263+ build (EAP included) among them, so
# a run can go red with no commit of ours. A red run whose failing step is the Gradle step and
# whose message is a network or HTTP error is a download failure: re-run the job.
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'scope-tracer-plugin/**'
      - '.github/workflows/plugin-verifier.yml'
  # The run that saves the IDE cache: a cache written on a pull request ref is readable only by
  # that ref, so only a run on main gives every pull request one to restore.
  push:
    branches: [ main ]
    paths:
      - 'scope-tracer-plugin/**'
      - '.github/workflows/plugin-verifier.yml'
  # Wednesday, off the top of the hour and off jdk-ea.yml's Saturday 06:17 UTC slot. Catches a new
  # EAP that breaks the plugin with no commit of ours, and refreshes the cache. GitHub mails a
  # failed scheduled run to whoever last edited this line.
  schedule:
    - cron: '43 5 * * 3'
  workflow_dispatch:

permissions:
  contents: read

# One run per ref. Two verifyPlugin runs share ~/.pluginVerifier, and one crashes with
# DirectoryNotEmptyException while the other downloads or extracts an IDE; a newer push cancels the
# older run instead of letting it extract into the same directories.
concurrency:
  group: plugin-verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # The same pair as release.yml's check job: 21 is for Gradle, 27 is listed last, so it is
      # JAVA_HOME for Maven and the plugin's toolchain.
      - name: Set up JDK 21 and 27
        uses: actions/setup-java@v5
        with:
          java-version: |
            21
            27
          distribution: 'temurin'
          cache: maven

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # What the verifier downloads into its own home, ~/.pluginVerifier/loaded-plugins (2.3 GB
      # locally, the plugins and dependencies it resolves for the IDEs), is not in the Gradle user
      # home, so setup-gradle does not cache it. (The IDEs themselves are Gradle dependencies, in the
      # Gradle user home, which setup-gradle caches; ~/.pluginVerifier/ides stays empty.) It is
      # restored on every run and saved by the last step, only by a run on main that succeeded, so a
      # failed or cancelled job never saves a half-written directory. The key is the files that
      # decide which IDEs are verified plus the ISO week, so main saves at most one entry a week
      # (the newest EAP's files come with it) and an exact hit saves nothing; the restore-keys
      # prefix starts a run from the newest older entry and downloads only what is missing. GitHub
      # evicts an entry nobody restored for seven days.
      - name: Name the cache key
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore the Plugin Verifier's downloads
        id: downloads
        uses: actions/cache/restore@v6
        with:
          path: ~/.pluginVerifier/loaded-plugins
          key: plugin-verifier-${{ hashFiles('scope-tracer-plugin/build.gradle.kts', 'scope-tracer-plugin/gradle.properties') }}-${{ steps.week.outputs.week }}
          restore-keys: |
            plugin-verifier-${{ hashFiles('scope-tracer-plugin/build.gradle.kts', 'scope-tracer-plugin/gradle.properties') }}-
            plugin-verifier-

      - name: Say whether the downloads were restored
        env:
          MATCHED_KEY: ${{ steps.downloads.outputs.cache-matched-key }}
        run: |
          if [ -n "$MATCHED_KEY" ]; then
            echo "Restored ~/.pluginVerifier/loaded-plugins from the cache entry $MATCHED_KEY"
          else
            echo "No cache entry to restore: the verifier downloads everything"
          fi
          du -sh "$HOME/.pluginVerifier/loaded-plugins" 2>/dev/null || true

      # The analyzer and agent jars the plugin bundles, as release.yml's check job builds them.
      - name: Build the analyzer and agent jars the plugin bundles
        run: mvn -B -q -DskipTests package

      # One Gradle invocation, one verifyPlugin, no --parallel: see the concurrency note above.
      - name: Build and verify the plugin
        working-directory: scope-tracer-plugin
        run: >-
          JAVA_HOME="$JAVA_HOME_21_X64" ./gradlew
          -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_27_X64
          javaToolchains buildPlugin verifyPluginStructure verifyPlugin

      # The IDEs that were verified (the verifier writes one report directory per IDE), where a red
      # run is read first. Gradle fails by itself when no IDE is configured; fewer than two would
      # pass silently, so this fails then.
      - name: Record the IDEs that were verified
        if: always()
        working-directory: scope-tracer-plugin
        run: |
          IDES=$(ls build/reports/pluginVerifier 2>/dev/null || true)
          {
            echo '### IDEs verified'
            echo '```'
            echo "${IDES:-(none)}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          COUNT=$(printf '%s' "$IDES" | grep -c . || true)
          echo "IDEs verified: $COUNT"
          if [ "$COUNT" -lt 2 ] && [ "${{ job.status }}" = "success" ]; then
            echo "::error::verifyPlugin verified $COUNT IDE(s); pluginVerification names two"
            exit 1
          fi

      # Runs only when every step above passed (the default), only on main (a pull request ref
      # could not share what it saves), and not when this week's entry was restored as it is.
      - name: Save the Plugin Verifier's downloads
        if: github.ref == 'refs/heads/main' && steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.pluginVerifier/loaded-plugins
          key: ${{ steps.downloads.outputs.cache-primary-key }}
