name: JDK 28 early access

# The agent's matchers bind to JDK internals (StructuredTaskScopeImpl's private constructor, fork
# and close), which can change in an EA build with no API change. A matcher that stops matching
# fails nothing by itself; the agent ITs notice, because they assert the events. This runs them on
# the newest JDK 28 EA build, so a break shows up within a week of the build that brought it,
# not on the day of 1.0. It is not a required check and does not run on every pull request.
on:
  # Saturday, after both vendors' Thursday/Friday EA builds, and off the top of the hour, when
  # GitHub delays scheduled runs. GitHub mails a failed scheduled run to whoever last edited this
  # line; that mail and the step summary are the whole notification.
  schedule:
    - cron: '17 6 * * 6'
  workflow_dispatch:
  # GitHub runs schedule and workflow_dispatch only from the default branch, so a pull request
  # that changes this file gets a real run before it merges.
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/jdk-ea.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    # Green takes a few minutes. A matcher break makes the agent ITs wait for events that never
    # come (17 min in the agent module when measured), so the limit leaves room for that.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # When 28-ea cannot be resolved (an Adoptium outage, or after JDK 28 GA, when Adoptium stops
      # publishing 28 EA builds) this step fails and the run is red here. That is accepted; moving
      # the job to the next EA (29-ea) belongs to #70.
      - name: Set up JDK 28 early access
        uses: actions/setup-java@v5
        with:
          java-version: '28-ea'
          distribution: 'temurin'
          cache: maven

      # The EA build number is the first thing a red run needs; put it where it is read without
      # opening the log.
      - name: Record the JDK build
        run: |
          {
            echo '### JDK under test'
            echo '```'
            java -version 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # -Pjdk-ea builds for the running JDK without --enable-preview: on 28 StructuredTaskScope is
      # final, and with the flag value classes (in preview in 28) stamp nearly every class
      # 72.65535, which ASM rejects. See _docs/decisions.md.
      - name: Build and test for JDK 28
        run: mvn -B -Pjdk-ea verify

      # The reports hold each failing IT's captured child-JVM output, which is where a matcher
      # break shows. The ITs record into JUnit temp dirs, which are deleted; a .jfr left in the
      # agent module is one a child JVM wrote there by mistake, and is kept too.
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jdk-ea-test-reports
          path: |
            scope-tracer-*/target/surefire-reports/
            scope-tracer-*/target/failsafe-reports/
            scope-tracer-agent/*.jfr
            scope-tracer-agent/target/*.jfr
          if-no-files-found: ignore
