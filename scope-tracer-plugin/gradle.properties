pluginGroup = com.ionutbanu.scopetracer

# IntelliJ Platform target used to compile/run the plugin. 2026.3 (build 263) is the first
# release that both runs on a JBR we target and knows language level 27, so it is the lowest IDE
# the plugin supports; there is deliberately no until-build. It runs on JBR 25, so the plugin is
# compiled for Java 25 (see build.gradle.kts); JBR 25 still cannot load the analyzer's Java 27
# classes, which is why the analyzer runs as a subprocess.
platformVersion = 2026.3
pluginSinceBuild = 263

# The Java feature version of the JBR bundled with the lowest supported IDE (25 for 2026.3, since
# build 263). The build fails when a class in the plugin jar or model.jar is newer than that JBR
# can load (class-file major = this + 44). It moves with pluginSinceBuild and is deliberately not
# derived from options.release: changing the compile target must not silently move the guard.
pluginMaxClassJava = 25

gsonVersion = 2.10.1

org.gradle.configuration-cache = true
